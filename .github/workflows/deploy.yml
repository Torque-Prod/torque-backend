name: Deploy Backend to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy Spring Boot JAR
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 16 (Corretto)
      - name: Set up Java 16
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '16'
          cache: maven

      # 3. Make mvnw executable (required on Linux runners)
      - name: Make mvnw executable
        run: chmod +x mvnw

      # 4. Build Spring Boot JAR
      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests

      # 5. Set up SSH key
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/torque.pem
          chmod 600 ~/.ssh/torque.pem
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 6. Upload JAR to server
      - name: Upload JAR to AWS server
        run: |
          ssh -i ~/.ssh/torque.pem ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "mkdir -p /home/ubuntu/torque"
          scp -i ~/.ssh/torque.pem target/*.jar ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/home/ubuntu/torque/torque.jar

      # 7. Restart backend service
      - name: Restart torque service on server
        run: |
          ssh -i ~/.ssh/torque.pem ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} \
            "sudo systemctl restart torque && sleep 5 && sudo systemctl is-active torque"
